name: Деплой на Timeweb

# Запускается на каждый пуш в main и вручную кнопкой в разделе Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Залить по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # куда класть на сервере, например /nechay.ru/public_html/
          server-dir: ${{ secrets.FTP_DIR }}
          # что не отправлять
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            README.md
            .gitignore
            фото/**
            api/config.php
